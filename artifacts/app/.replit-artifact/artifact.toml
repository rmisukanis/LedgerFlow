kind = "web"
previewPath = "/"
title = "Business Suite"
description = "A three-module business suite with a shared backend: (1) QuickBooks Manager for OAuth-connected invoice CRUD and Excel bulk upload, (2) API Explorer for writing and running API calls with code, and (3) Financial Intelligence for transaction tracking with AI-ready scaffolding."
version = "1.0.0"
id = "artifacts/app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23863

[services.development]
run = "pnpm --filter @workspace/app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/app", "run", "build" ]
serve = "static"
publicDir = "artifacts/app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23863"
BASE_PATH = "/"
